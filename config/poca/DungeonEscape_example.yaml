#You can duplicate this file and change the reward parameters as you need for your own training runs.
behaviors:
  DungeonEscape:
    trainer_type: poca
    hyperparameters: #Settings for the algorithm that trains the agents.
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 64
    summary_freq: 200000

#These are the settings for the reward system
environment_parameters:
  reward_type: 0 # 0 = sparse reward, 1 = shaped reward
  goal_reward: 0.0 # This is the value of the reward the agents get when they successfuly escape.
  step_penalty: 0.0 # Value of step penalty (A small penalty on each step if agents have not reached goal). Should be a small negative number e.g. -0.001
  checkpoint_bonus: 0.0 # Value of the reward the agents get for grabbing the key.
  shaping_scale: 0.01 # Opossite of step penalty (Rewards agents for getting closer to key). Should be a small positive number.
